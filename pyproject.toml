[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tesseract-llm"
version = "0.1.0"
description = "TESSERACT compiler-executor language model scaffold"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Johannes Poms"}
]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
