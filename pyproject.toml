[build-system]
requires = ["uv_build>=0.6.6,<0.7"]
build-backend = "uv_build"

[project]
name = "tesseract"
version = "0.1.0"
description = "TESSERACT compiler-executor language model scaffold"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  {name = "Johannes Poms"}
]
dependencies = [
  "numpy>=2.4.3",
  "torch==2.8.0",
]

# target torch to cuda 12.8 or CPU
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.optional-dependencies]
cpu = [
    "torch==2.8.0",
]
gpu = [
    "torch==2.8.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=7.0,<8",
    "ruff>=0.13,<0.14",
]

[tool.uv.build-backend]
source-dir = "src"

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
warn_unused_configs = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
